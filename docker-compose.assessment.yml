services:
  redis:
    ports: !override []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  es:
    ports: !override []

  kibana:
    profiles:
      - disabled
    ports: !override []

  vc-db:
    ports: !override []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  vc-platform-web:
    image: vc-platform:local-latest
    ports: !override
      - "127.0.0.1:${PLATFORM_PORT:-8090}:80"
    depends_on:
      vc-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      es:
        condition: service_healthy

  vc-frontend:
    image: vc-frontend:local-latest
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
